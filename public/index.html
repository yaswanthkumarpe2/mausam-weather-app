<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mausam</title>
    <meta name="description" content="A personalized weather app with maps, farm and health hubs, trip planning and community reports.">
    <meta name="theme-color" content="#0a2540">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/app.css">
  </head>
  <body>
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="shell">
      <nav id="tabs" class="tabs" aria-label="Main"></nav>
      <main id="app" class="app"></main>
    </div>
    <dialog id="sheet" class="sheet"></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript>Mausam needs JavaScript to show the forecast.</noscript>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
